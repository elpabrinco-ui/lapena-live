name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub runner already ships with the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 (ver Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk LaPenaLive.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: LaPenaLive-apk
          path: LaPenaLive.apk

      # Publish to a fixed release so the APK can be downloaded straight from the phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version LaPenaLive.apk \
            --title "La Peña Live – última versión" \
            --notes "Build automático del commit ${GITHUB_SHA::7}. Descargá LaPenaLive.apk e instalalo en el celular. [versionCode=${GITHUB_RUN_NUMBER}]" \
            --prerelease

      # Ramas de prueba: se publican aparte ("prueba-<rama>"), sin tocar la versión que usa todo el equipo.
      - name: Publish test release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="prueba-${BRANCH//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" LaPenaLive.apk \
            --target "$GITHUB_SHA" \
            --title "La Peña Live – PRUEBA ($BRANCH)" \
            --notes "Versión de prueba de la rama $BRANCH (commit ${GITHUB_SHA::7}). No es la versión del equipo. [versionCode=${GITHUB_RUN_NUMBER}]" \
            --prerelease
