name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LaPenaLive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LaPenaLive-apk
          path: LaPenaLive.apk

      # Publish to a fixed release so the APK can be downloaded straight from the phone.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version LaPenaLive.apk \
            --title "La Peña Live – última versión" \
            --notes "Build automático del commit ${GITHUB_SHA::7}. Descargá LaPenaLive.apk e instalalo en el celular." \
            --prerelease
